name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js
      - run: npm pkg get name version dsh engines

  manifest:
    runs-on: ubuntu-latest
    name: bundle manifest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: the patch file exists and is a loader patch array
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const patch = pkg.dsh?.bundle?.patch;
            if (typeof patch !== "string") throw new Error("package.json is missing dsh.bundle.patch");
            const file = patch.replace(/^\.\//, "");
            if (!fs.existsSync(file)) throw new Error(`dsh.bundle.patch points at missing file ${patch}`);
            const text = fs.readFileSync(file, "utf8");
            if (!/^- insert:/m.test(text)) throw new Error(`${file} has no top-level insert list`);
            for (const entry of pkg.files ?? []) {
              if (!fs.existsSync(entry)) throw new Error(`package.json files entry ${entry} does not exist`);
            }
            console.log("ok:", file);
          '
      - name: the entry point loads and exports a Cordis plugin
        run: |
          node -e '
            import("./src/index.js").then((mod) => {
              if (typeof mod.apply !== "function") throw new Error("missing apply()");
              if (typeof mod.name !== "string") throw new Error("missing name");
              if (!Array.isArray(mod.inject)) throw new Error("missing inject[]");
              console.log("ok:", mod.name, mod.inject.join(","));
            }).catch((error) => { console.error(error); process.exit(1); });
          '
